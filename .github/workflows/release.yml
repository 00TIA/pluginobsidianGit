name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'
    # Also from GitHub: Actions → Release Obsidian plugin → Run workflow.
    # The draft release gets its tag when it is published.
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to release, as in manifest.json (e.g. 1.0.0)'
                required: true

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Check the version
              id: version
              env:
                  EVENT: ${{ github.event_name }}
                  INPUT_VERSION: ${{ inputs.version }}
              run: |
                  if [ "$EVENT" = "workflow_dispatch" ]; then tag="$INPUT_VERSION"; else tag="${GITHUB_REF#refs/tags/}"; fi
                  manifest=$(node -p "require('./manifest.json').version")
                  if [ "$tag" != "$manifest" ]; then
                    echo "::error::Version $tag does not match manifest.json ($manifest)"
                    exit 1
                  fi
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            # GitHub supports attestations in private repositories only on Enterprise plans
            - name: Attest build provenance
              if: ${{ !github.event.repository.private }}
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  gh release create "$TAG" \
                    --title="$TAG" \
                    --draft \
                    --target "$GITHUB_SHA" \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
