name: CI

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        name: Build, lint and test (Linux, Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x, 24.x]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            - run: npm run build
            - run: npm run lint
            - run: npm test

    test-os:
        # git lookup, environment and paths differ on macOS and Windows: run the tests there too
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22.x
                  cache: 'npm'
            - run: npm ci
            - run: npm test
